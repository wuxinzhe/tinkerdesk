# TinkerDesk 打包配置（electron-builder）
appId: com.tinkerdesk.app
productName: TinkerDesk
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!node_modules/.cache"
extraResources:
  # 构建产物资源（npm-cli——打包时生成——git 忽略）
  - from: resources/npm
    to: npm
    filter: ["**/*"]
  # 应用资源（工具 schema 模板 / 提示词模板 / 技能分类 / 图标——getResourcesDir 读取——
  # 单一来源 src/main/resources——dev 加载与打包拷贝同源）
  - from: src/main/resources/tool-schemas
    to: tool-schemas
    filter: ["**/*"]
  - from: src/main/resources/prompts
    to: prompts
    filter: ["**/*"]
  - from: src/main/resources/skill-categories.json
    to: skill-categories.json
  - from: src/main/resources/icon.png
    to: icon.png
# 打包图标（build/icon.png——electron-builder 自动生成 ico——exe/安装包/快捷方式）
icon: build/icon.png
# 构建前生成 resources/npm 由 package.json 的 dist 脚本负责（beforePack 只接受函数——yml 不支持脚本路径）
npmRebuild: false
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
